services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: dwh
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: always

  # ========== AIRFLOW ==========
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    restart: always

  airflow-init:
    image: apache/airflow:2.8.1
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__RBAC: 'true'
    volumes:
      - ./airflow/dags:/opt/airflow/dags      # ← ИСПРАВЛЕНО
      - ./airflow/logs:/opt/airflow/logs      # ← ИСПРАВЛЕНО
      - ./sql:/opt/airflow/sql
      - ./etl.py:/opt/airflow/etl.py
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    restart: on-failure

  airflow-webserver:
    image: apache/airflow:2.8.1
    depends_on:
      - airflow-postgres
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__WEBSERVER__RBAC: 'true'
    volumes:
      - ./airflow/dags:/opt/airflow/dags      # ← ИСПРАВЛЕНО
      - ./airflow/logs:/opt/airflow/logs      # ← ИСПРАВЛЕНО
      - ./sql:/opt/airflow/sql
      - ./etl.py:/opt/airflow/etl.py
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  airflow-scheduler:
    image: apache/airflow:2.8.1
    depends_on:
      - airflow-postgres
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags      # ← УЖЕ ПРАВИЛЬНО
      - ./airflow/logs:/opt/airflow/logs      # ← УЖЕ ПРАВИЛЬНО
      - ./sql:/opt/airflow/sql
      - ./etl.py:/opt/airflow/etl.py
    command: scheduler
    restart: always

volumes:
  pg_data:
  airflow_pg_data: